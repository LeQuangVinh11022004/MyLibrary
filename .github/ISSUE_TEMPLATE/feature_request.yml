name: Feature request
description: Suggest an improvement or new capability
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Do not include credentials, private documents, or personal data.
  - type: textarea
    id: problem
    attributes:
      label: Problem or user need
      description: What are you trying to do that is difficult or unsupported?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative approaches or workarounds?
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add sketches or sanitized screenshots if useful.
    validations:
      required: false

