worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  types {
    application/javascript mjs;
  }
  default_type application/octet-stream;
  server_tokens off;
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  sendfile on;
  keepalive_timeout 30;
  client_max_body_size 1m;

  map $http_cf_connecting_ip $client_real_ip {
    default $http_cf_connecting_ip;
    ""      $binary_remote_addr;
  }

  map $http_user_agent $is_bad_crawler {
    default 0;
    ""      1;
    ~*(?:bot|crawler|spider|scrapy|curl|wget|python-requests|httpx|aiohttp|go-http-client|headlesschrome|phantomjs|gptbot|chatgpt-user|ccbot|claudebot|anthropic-ai|bytespider|amazonbot|semrushbot|ahrefsbot|mj12bot|dotbot) 1;
  }

  limit_req_zone $client_real_ip zone=app_limit:10m rate=30r/s;
  limit_req_zone $client_real_ip zone=api_limit:10m rate=15r/s;
  limit_req_zone $client_real_ip zone=auth_limit:10m rate=10r/m;
  limit_conn_zone $client_real_ip zone=client_limit:10m;
  limit_req_status 429;
  limit_conn_status 429;

  upstream api_pool {
    least_conn;
    server api1:3001 max_fails=2 fail_timeout=10s;
    server api2:3001 max_fails=2 fail_timeout=10s;
    keepalive 32;
  }

  open_file_cache max=2000 inactive=30s;
  open_file_cache_valid 60s;
  tcp_nopush on;
  tcp_nodelay on;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types application/javascript application/json application/wasm image/svg+xml text/css text/plain;

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' blob: https://fonts.googleapis.com; font-src 'self' data: blob: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; worker-src 'self' blob:; frame-src 'self' blob:; media-src 'self' blob: data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests" always;

    limit_conn client_limit 40;
    limit_req zone=app_limit burst=60 nodelay;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location = /robots.txt {
      access_log off;
      expires 1d;
      add_header Cache-Control "public, max-age=86400" always;
      try_files $uri =404;
    }

    location ~ ^/api/auth/(guard|challenge)$ {
      if ($is_bad_crawler) {
        return 403;
      }
      limit_req zone=auth_limit burst=6 nodelay;
      proxy_pass http://api_pool;
      proxy_set_header Connection "";
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 3s;
      proxy_read_timeout 5s;
    }

    location /api/ {
      if ($is_bad_crawler) {
        return 403;
      }
      limit_req zone=api_limit burst=25 nodelay;
      proxy_pass http://api_pool;
      proxy_set_header Connection "";
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 3s;
      proxy_read_timeout 5s;
    }

    location /assets/ {
      if ($is_bad_crawler) {
        return 403;
      }
      expires 1y;
      add_header Cache-Control "public, max-age=31536000, s-maxage=31536000, immutable" always;
      add_header CDN-Cache-Control "public, max-age=31536000, immutable" always;
      add_header Access-Control-Allow-Origin "*" always;
      try_files $uri =404;
    }

    location / {
      if ($is_bad_crawler) {
        return 403;
      }
      expires -1;
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      try_files $uri $uri/ /index.html;
    }
  }
}
